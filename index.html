<head>

<style>

  [hidden] { display: none !important; }
  button, label { display: inline-block; font: inherit; padding: .6rem 1rem; margin: .5rem .5rem .5rem 0;
    border: 1px solid #555; border-radius: .4rem; background: #eee; color: #000; cursor: pointer; }
  button:disabled { opacity: .5; }
  table { width: 100%; border-collapse: collapse; font-size: 1.2rem; }
  td { padding: .2rem 0; }
  td:last-child { text-align: right; font-variant-numeric: tabular-nums; }

  footer { margin-top: 2rem; }
  footer svg { display: block; width: 10rem; height: 10rem; }

<body>
<h1>Leaf classifier</h1>
<p id="status">Loading the model...</p>

<video id="video" playsinline muted autoplay hidden></video>
<canvas id="canvas"></canvas>

<button id="start" disabled>Start camera</button>
<label>Upload photo
  <input id="upload" type="file" accept="image/*" hidden disabled>
</label>

<table id="results"></table>

<script src="https://cdn.jsdelivr.net/npm/onnxruntime-web@1.31.1/dist/ort.min.js"></script>
<script>
const video = document.getElementById("video");
const canvas = document.getElementById("canvas");
const context = canvas.getContext("2d", { willReadFrequently: true });
const statusText = document.getElementById("status");
const startButton = document.getElementById("start");
const uploadInput = document.getElementById("upload");
const results = document.getElementById("results");

let info, session;
let running = false;
let queue = Promise.resolve();   // session.run must not overlap, so jobs wait for each other

async function classify(source, width, height) {
  const size = info.input_size;

  // Crop the central square and resize it to the input size.
  const side = Math.min(width, height);
  context.imageSmoothingQuality = "high";
  context.drawImage(source, (width - side) / 2, (height - side) / 2, side, side, 0, 0, size, size);
  const pixels = context.getImageData(0, 0, size, size).data;   // R, G, B, A, R, G, B, A, ...

  // Scale to 0-1 and standardize. Channels first: all R, then all G, then all B.
  const count = size * size;
  const input = new Float32Array(3 * count);
  for (let channel = 0; channel < 3; channel++) {
    for (let i = 0; i < count; i++) {
      input[channel * count + i] = (pixels[4 * i + channel] / 255 - info.mean[channel]) / info.std[channel];
    }
  }

  const output = await session.run({ image: new ort.Tensor("float32", input, [1, 3, size, size]) });
  show(softmax(Array.from(output.logits.data)));
}

function softmax(logits) {
  const exps = logits.map(Math.exp);
  const sum = exps.reduce((a, b) => a + b);
  return exps.map(e => e / sum);
}

function show(probabilities) {
  const best = probabilities.indexOf(Math.max(...probabilities));
  results.innerHTML = "";
  info.classes.forEach((name, i) => {
    const row = results.insertRow();
    row.insertCell().textContent = name;
    row.insertCell().textContent = probabilities[i].toFixed(3);
    if (i === best) row.className = "top";
  });
}

function enqueue(job) {
  queue = queue.then(job);
  const result = queue;
  queue = queue.catch(() => {});   // one failed job must not block the next ones
  return result;
}

async function liveLoop() {
  if (!running) return;
  if (video.readyState >= 2) {
    try {
      await enqueue(() => running && classify(video, video.videoWidth, video.videoHeight));
    } catch (error) {
      stopCamera();
      statusText.textContent = "Error: " + error.message;
      return;
    }
  }
  requestAnimationFrame(liveLoop);
}

function stopCamera() {
  running = false;
  if (video.srcObject) video.srcObject.getTracks().forEach(track => track.stop());
  video.srcObject = null;
  video.hidden = true;
  canvas.hidden = false;
  startButton.disabled = false;
}

startButton.onclick = async () => {
  startButton.disabled = true;
  try {
    video.srcObject = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: { ideal: "environment" } }, audio: false,
    });
    video.hidden = false;
    canvas.hidden = true;
    await video.play();
    statusText.textContent = "Camera on. Point the central square at a leaf.";
    running = true;
    liveLoop();
  } catch (error) {
    stopCamera();
    statusText.textContent = "Camera not available (" + error.message + "). Upload a photo instead.";
  }
};

uploadInput.onchange = async () => {
  const file = uploadInput.files[0];
  if (!file) return;
  stopCamera();
  const url = URL.createObjectURL(file);
  const image = new Image();
  image.src = url;
  try {
    await image.decode();
    await enqueue(() => classify(image, image.naturalWidth, image.naturalHeight));
    statusText.textContent = "Photo: " + file.name;
  } catch (error) {
    statusText.textContent = "Could not read this photo: " + error.message;
  }
  URL.revokeObjectURL(url);
  uploadInput.value = "";   // so that the same file can be chosen again
};

async function main() {
  info = await (await fetch("model_info.json")).json();
  canvas.width = canvas.height = info.input_size;
  session = await ort.InferenceSession.create("leaf_model.onnx", { executionProviders: ["wasm"] });
  startButton.disabled = false;
  uploadInput.disabled = false;
  statusText.textContent = "Ready. Start the camera or upload a photo.";
}

main().catch(error => { statusText.textContent = "Could not load the model: " + error.message; });
</script>
